name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Configure production AGS credentials for the build.
      # This ensures the production build uses the dedicated prod OAuth client
      # (separate from dev for safety and isolation).
      #
      # VITE_AGS_PROD_CLIENT_ID: dedicated OAuth client ID for production
      # VITE_AGS_PROD_REDIRECT_URI: production domain redirect URI
      #   (must match exactly what's registered in AGS admin)
      #
      # The app detects production via isProduction() in ags-config.js
      # and automatically selects the prod client credentials.
      #
      # ⚠️  TODO: Create a dedicated OAuth client in AGS admin console:
      #     1. Login to AGS admin for abyuditest-pawsandpanic
      #     2. Create new OAuth client (e.g., "Paws & Panic Web Prod")
      #     3. Set redirect URI to: https://yudi-ab.github.io/paws-and-panic/
      #     4. Copy the client ID and update VITE_AGS_PROD_CLIENT_ID below
      #
      - name: Configure production AGS credentials
        run: |
          echo "VITE_AGS_BASE_URL=https://abyuditest-pawsandpanic.prod.gamingservices.accelbyte.io" >> .env.production
          echo "VITE_AGS_NAMESPACE=abyuditest-pawsandpanic" >> .env.production
          # Dedicated production OAuth client (separate from dev for safety)
          # ✅ Created 2026-09-12 with AGS CLI
          echo "VITE_AGS_PROD_CLIENT_ID=8bf714a8a0984eb69364c32c072a57f0" >> .env.production
          echo "VITE_AGS_PROD_REDIRECT_URI=https://yudi-ab.github.io/paws-and-panic/" >> .env.production
          # Dev client fallback (for compatibility)
          echo "VITE_AGS_CLIENT_ID=1d2aecca2a234c49b14a664f1b7953fc" >> .env.production
          echo "VITE_AGS_REDIRECT_URI=http://localhost:5173" >> .env.production
          # Match pools and leaderboards
          echo "VITE_AGS_MATCH_POOL_30=paws-panic-30s" >> .env.production
          echo "VITE_AGS_MATCH_POOL_60=paws-panic-60s" >> .env.production
          echo "VITE_AGS_STAT_LONGEST_METERS=longest-run-meters" >> .env.production
          echo "VITE_AGS_STAT_LONGEST_SECONDS=longest-run-seconds" >> .env.production
          echo "VITE_AGS_STAT_TOTAL_WINS=total-wins" >> .env.production
          echo "VITE_AGS_STAT_TOTAL_LOSSES=total-losses" >> .env.production
          echo "VITE_AGS_LEADERBOARD_METERS=longest-run-meters" >> .env.production
          echo "VITE_AGS_LEADERBOARD_SECONDS=longest-run-seconds" >> .env.production

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

#      - name: Enforce launch performance budget
#        run: npm run perf:budget
#
#      - name: Store bundle metrics
#        uses: actions/upload-artifact@v4
#        with:
#          name: performance-budget-${{ github.sha }}
#          path: performance-budget.json
#          retention-days: 90

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy result
        if: always()
        run: |
          echo "✅ Deployed to GitHub Pages"
          echo "📍 URL: https://yudi-ab.github.io/paws-and-panic/"
